<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accusé • Alibi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/accuse.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
</head>
<body class="accused-body">
  <div class="background"></div>

  <!-- État de connexion -->
  <div class="connection-status" id="connection-status">
    <span class="status-text" id="status-text">Connexion...</span>
  </div>

  <!-- Info de partie -->
  <div class="room-info" id="room-info">
    <div>Interrogatoire: <span id="room-code-display">ALIBI-GAME</span></div>
  </div>

  <!-- Scores des équipes -->
  <div class="team-score team-score-a active" id="team-score-a">
    <div class="team-name">Équipe A</div>
    <div class="score-circles" id="team-a-circles">
      <span class="score-circle pending"></span>
      <span class="score-circle pending"></span>
      <span class="score-circle pending"></span>
      <span class="score-circle pending"></span>
      <span class="score-circle pending"></span>
    </div>
    <div class="team-total"><span id="team-a-score">0</span>/5</div>
  </div>
  
  <div class="team-score team-score-b" id="team-score-b">
    <div class="team-name">Équipe B</div>
    <div class="score-circles" id="team-b-circles">
      <span class="score-circle pending"></span>
      <span class="score-circle pending"></span>
      <span class="score-circle pending"></span>
      <span class="score-circle pending"></span>
      <span class="score-circle pending"></span>
    </div>
    <div class="team-total"><span id="team-b-score">0</span>/5</div>
  </div>

  <!-- Overlay de flash pour les animations -->
  <div class="flash-overlay" id="flash-overlay"></div>

  <!-- Écran principal -->
  <main class="accused-main">
    <!-- Section d'attente -->
    <section class="waiting-screen" id="waiting-screen">
      <h1 class="accused-title">
        Accusé<span class="blinker">_</span>
      </h1>
      <p class="waiting-text">En attente du début de l'interrogatoire...</p>
      <div class="loading-dots">
        <span>.</span><span>.</span><span>.</span>
      </div>
    </section>

    <!-- Section de jeu -->
    <section class="game-screen" id="game-screen" style="display: none;">
      <!-- Question centrale -->
      <div class="question-container">
        <div class="question-label">&gt; Question actuelle</div>
        <div class="question-text" id="current-question">
          En attente d'une question...
        </div>
      </div>
    </section>

    <!-- Section de fin -->
    <section class="end-screen" id="end-screen" style="display: none;">
      <h2 class="end-title">Interrogatoire terminé</h2>
      <div class="final-score">
        <p>Scores finaux:</p>
        <p>Équipe A: <span id="final-score-a">0</span>/5</p>
        <p>Équipe B: <span id="final-score-b">0</span>/5</p>
      </div>
      <div class="end-message" id="end-message">
        Merci d'avoir participé à l'interrogatoire !
      </div>
    </section>
  </main>

  <!-- Navigation -->
  <nav class="accused-nav">
    <a href="/" class="nav-btn">&gt; Menu</a>
  </nav>

  <script>
    // Configuration WebSocket
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}`;
    let ws = null;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;

    // État local
    let gameState = {
      teams: { A: { score: 0 }, B: { score: 0 } },
      activeTeam: 'A',
      currentQuestion: '',
      status: 'waiting'
    };

    // Éléments DOM
    const elements = {
      statusText: document.getElementById('status-text'),
      connectionStatus: document.getElementById('connection-status'),
      roomInfo: document.getElementById('room-info'),
      waitingScreen: document.getElementById('waiting-screen'),
      gameScreen: document.getElementById('game-screen'),
      endScreen: document.getElementById('end-screen'),
      currentQuestion: document.getElementById('current-question'),
      teamAScore: document.getElementById('team-a-score'),
      teamBScore: document.getElementById('team-b-score'),
      teamACircles: document.getElementById('team-a-circles'),
      teamBCircles: document.getElementById('team-b-circles'),
      teamScoreA: document.getElementById('team-score-a'),
      teamScoreB: document.getElementById('team-score-b'),
      flashOverlay: document.getElementById('flash-overlay'),
      finalScoreA: document.getElementById('final-score-a'),
      finalScoreB: document.getElementById('final-score-b'),
      endMessage: document.getElementById('end-message')
    };

    // Connexion WebSocket
    function connectWebSocket() {
      try {
        ws = new WebSocket(wsUrl);
        
        ws.onopen = function() {
          console.log('✅ Connexion WebSocket établie');
          elements.statusText.textContent = 'Connecté • Synchronisation...';
          elements.connectionStatus.style.display = 'block';
          elements.roomInfo.style.display = 'block';
          reconnectAttempts = 0;
          
          // S'enregistrer comme accusé
          ws.send(JSON.stringify({
            type: 'register',
            role: 'accused'
          }));
          
          console.log('📡 Enregistrement envoyé - En attente de l\'état du jeu...');
        };

        ws.onmessage = function(event) {
          try {
            const message = JSON.parse(event.data);
            handleWebSocketMessage(message);
          } catch (error) {
            console.error('❌ Erreur parsing message:', error);
          }
        };

        ws.onclose = function() {
          console.log('🔌 Connexion WebSocket fermée');
          elements.statusText.textContent = 'Déconnecté';
          
          // Tentative de reconnexion
          if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            console.log(`🔄 Tentative de reconnexion ${reconnectAttempts}/${maxReconnectAttempts}...`);
            setTimeout(connectWebSocket, 2000 * reconnectAttempts);
          } else {
            elements.statusText.textContent = 'Connexion perdue';
          }
        };

        ws.onerror = function(error) {
          console.error('❌ Erreur WebSocket:', error);
          elements.statusText.textContent = 'Erreur de connexion';
        };

      } catch (error) {
        console.error('❌ Erreur lors de la connexion:', error);
        elements.statusText.textContent = 'Impossible de se connecter';
      }
    }

    // Gestion des messages WebSocket
    function handleWebSocketMessage(message) {
      console.log('📨 Message reçu:', message);

      switch (message.type) {
        case 'gameState':
          // Mise à jour de l'état complet du jeu
          updateGameState(message.data);
          break;

        case 'feedback':
          // Feedback visuel (correct/incorrect)
          triggerFeedback(message.data.isCorrect);
          break;

        case 'scoreUpdate':
          // Mise à jour du score d'une équipe
          updateTeamScore(message.data.team, message.data.score, message.data.isCorrect);
          // Mettre à jour l'historique local si fourni
          if (message.data.answers) {
            restoreTeamAnswers(message.data.team, message.data.answers);
          }
          break;

        case 'teamReset':
          // Reset d'une équipe
          resetTeamScore(message.data.team);
          break;

        case 'questionUpdate':
          // Nouvelle question
          updateQuestion(message.data.question);
          break;

        case 'teamToggle':
          // Changement d'équipe active
          setActiveTeam(message.data.activeTeam);
          break;

        case 'fullReset':
          // Reset complet
          resetAllScores();
          updateQuestion(message.data.question);
          setActiveTeam(message.data.activeTeam);
          break;

        case 'gameStart':
          // Début du jeu
          startGame();
          break;

        case 'gameEnd':
          // Fin du jeu
          endGame(message.data.finalScores);
          break;

        default:
          console.log('⚠️ Type de message non géré:', message.type);
      }
    }

    // Mise à jour de l'état du jeu
    function updateGameState(newState) {
      gameState = { ...gameState, ...newState };
      
      console.log('🔄 État du jeu mis à jour:', gameState);
      
      // Mettre à jour l'affichage des scores
      updateTeamScore('A', gameState.teams.A.score);
      updateTeamScore('B', gameState.teams.B.score);
      
      // Restaurer les cercles de score avec l'historique
      if (gameState.teams.A.answers) {
        restoreTeamAnswers('A', gameState.teams.A.answers);
      }
      if (gameState.teams.B.answers) {
        restoreTeamAnswers('B', gameState.teams.B.answers);
      }
      
      // Mettre à jour la question et l'équipe active
      updateQuestion(gameState.currentQuestion);
      setActiveTeam(gameState.activeTeam);
      
      // Gérer l'état du jeu
      if (gameState.status === 'playing') {
        startGame();
      } else if (gameState.status === 'ended') {
        endGame(gameState.teams);
      }
      
      // Mettre à jour le statut pour indiquer que la synchronisation est terminée
      if (elements.statusText.textContent.includes('Synchronisation')) {
        elements.statusText.textContent = gameState.status === 'playing' ? 
          'Connecté • Interrogatoire en cours' : 'Connecté • En attente';
      }
    }

    // Restaurer l'historique des réponses d'une équipe
    function restoreTeamAnswers(team, answers) {
      const circlesElement = team === 'A' ? elements.teamACircles : elements.teamBCircles;
      
      if (circlesElement && answers) {
        const circles = circlesElement.querySelectorAll('.score-circle');
        circles.forEach((circle, index) => {
          if (index < answers.length) {
            const answer = answers[index];
            circle.className = answer.correct ? 'score-circle correct' : 'score-circle incorrect';
          } else {
            circle.className = 'score-circle pending';
          }
        });
      }
    }

    // Démarrer le jeu
    function startGame() {
      elements.waitingScreen.style.display = 'none';
      elements.gameScreen.style.display = 'block';
      elements.endScreen.style.display = 'none';
      elements.statusText.textContent = 'Connecté • Interrogatoire en cours';
    }

    // Terminer le jeu
    function endGame(finalScores) {
      elements.waitingScreen.style.display = 'none';
      elements.gameScreen.style.display = 'none';
      elements.endScreen.style.display = 'block';
      elements.statusText.textContent = 'Connecté • Terminé';
      
      elements.finalScoreA.textContent = finalScores.A.score;
      elements.finalScoreB.textContent = finalScores.B.score;
      
      // Déterminer le gagnant
      if (finalScores.A.score > finalScores.B.score) {
        elements.endMessage.textContent = 'Équipe A gagne !';
      } else if (finalScores.B.score > finalScores.A.score) {
        elements.endMessage.textContent = 'Équipe B gagne !';
      } else {
        elements.endMessage.textContent = 'Match nul !';
      }
    }

    // Mettre à jour une question
    function updateQuestion(question) {
      if (elements.currentQuestion) {
        elements.currentQuestion.textContent = question;
      }
    }

    // Mettre à jour le score d'une équipe
    function updateTeamScore(team, score, isCorrect = null) {
      const scoreElement = team === 'A' ? elements.teamAScore : elements.teamBScore;
      const circlesElement = team === 'A' ? elements.teamACircles : elements.teamBCircles;
      
      if (scoreElement) {
        scoreElement.textContent = score;
      }
      
      if (circlesElement) {
        const circles = circlesElement.querySelectorAll('.score-circle');
        circles.forEach((circle, index) => {
          if (index < score) {
            // Pour les cercles remplis, on détermine s'ils sont corrects ou incorrects
            // Pour simplifier, on considère que les derniers points ajoutés correspondent au type
            if (isCorrect !== null && index === score - 1) {
              circle.className = isCorrect ? 'score-circle correct' : 'score-circle incorrect';
            } else if (!circle.classList.contains('correct') && !circle.classList.contains('incorrect')) {
              circle.className = 'score-circle correct'; // Par défaut correct si pas spécifié
            }
          } else {
            circle.className = 'score-circle pending';
          }
        });
      }
    }

    // Reset du score d'une équipe
    function resetTeamScore(team) {
      updateTeamScore(team, 0);
    }

    // Reset de tous les scores
    function resetAllScores() {
      resetTeamScore('A');
      resetTeamScore('B');
    }

    // Définir l'équipe active
    function setActiveTeam(team) {
      if (team === 'A') {
        elements.teamScoreA.classList.add('active');
        elements.teamScoreB.classList.remove('active');
      } else {
        elements.teamScoreB.classList.add('active');
        elements.teamScoreA.classList.remove('active');
      }
    }

    // Feedback visuel
    function triggerFeedback(isCorrect) {
      const body = document.body;
      
      if (isCorrect) {
        // Effet de succès
        elements.flashOverlay.className = 'flash-overlay success';
        body.classList.add('feedback-success-global');
        
        // Vibration success (si supportée)
        if (navigator.vibrate) {
          navigator.vibrate([50, 30, 50]);
        }
        
        setTimeout(() => {
          elements.flashOverlay.className = 'flash-overlay';
          body.classList.remove('feedback-success-global');
        }, 1200);
        
      } else {
        // Effet d'erreur
        elements.flashOverlay.className = 'flash-overlay error';
        body.classList.add('feedback-error-global', 'shake-global');
        
        // Vibration error (si supportée)
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100, 50, 100]);
        }
        
        setTimeout(() => {
          elements.flashOverlay.className = 'flash-overlay';
          body.classList.remove('feedback-error-global', 'shake-global');
        }, 1200);
      }
    }

    // Initialisation
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🎮 Page Accusé initialisée');
      connectWebSocket();
    });

    // Gestion de la fermeture de la page
    window.addEventListener('beforeunload', function() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      }
    });
  </script>
</body>
</html>
